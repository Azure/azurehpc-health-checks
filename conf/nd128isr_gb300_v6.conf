# Mon Aug 24 21:25:25 UTC 2026
#
# Standard_ND128isr_GB300_v6 (aarch64, 2x Grace CPU, 4x NVIDIA GB300)
# Direct-path thresholds target 80% of advertised unidirectional path rates.
# NCCL allreduce uses a rounded 80% floor from validated collective bus bandwidth.
#


#######################################################################
###
### Hardware checks
###
 # NOTE: aarch64 /proc/cpuinfo has no "physical id" field (x86-only), so
 # NHC's core check_hw_cpuinfo counts all 128 logical CPUs as "sockets"
 # rather than the real 2 physical Grace sockets (confirmed via lscpu).
 # This is an upstream NHC/ARM limitation, not fixable from this conf.
 * || check_hw_cpuinfo 128 128 128
 # GB300 baseline from /proc/meminfo MemTotal, in kB.
 * || check_hw_physmem 2064534784kB 2064534784kB 3%
 * || check_hw_swap 0kB 0kB 3%
 * || check_hw_ib 800 mlx5_ib0:1
 * || check_hw_ib 800 mlx5_ib1:1
 * || check_hw_ib 800 mlx5_ib2:1
 * || check_hw_ib 800 mlx5_ib3:1
 * || check_hw_eth lo
 * || check_hw_eth eth0
 * || check_hw_eth eth1
 * || check_hw_eth ib0
 * || check_hw_eth ib1
 * || check_hw_eth ib2
 * || check_hw_eth ib3
 * || check_hw_eth docker0
 # 5 = 4x 3.5TB local scratch NVMe + 1x 64GB "MSFT NVMe Accelerator" boot-path
 # device; the Azure docs list 4 local disks but this 5th device is present
 # and detected by NHC on every ND128isr_GB300_v6 node observed so far.
 * || check_nvme_count 5


#######################################################################
####
#### GPU checks
####
 * || check_gpu_count 4
 * || check_nvsmi_healthmon
 * || check_gpu_xid
 # NVLink-C2C provides 900 GB/s bidirectional bandwidth across the two GPUs
 # attached to each Grace CPU: 225 GB/s per GPU per direction, with a 180-GB/s
 # floor. Fifth-generation NVLink provides 1.8 TB/s bidirectional per GPU:
 # 900 GB/s per direction, with a 720-GB/s floor.
 * || check_gpu_bw 180 720
 * || check_gpu_ecc 20000000 10000
 * || check_gpu_clock_throttling
 # GB300 ePCIv2 exposes topology to NCCL, so no topology file is required.
 # 540 GB/s rounds down the 80% floor from the validated 681.2 GB/s result.
 * || check_nccl_allreduce 540 3 16G
 * || check_nvlink_status


#######################################################################
####
#### IB checks
####
 # CPU RDMA uses same-HCA hardware loopback. The 350-Gb/s threshold is a
 # rounded 80% floor for the ~440-Gb/s effective PCIe Gen5 host-memory path.
 * || check_ib_bw_non_gdr 350 8388608
 # GB300 DataDirect GPU/HCA affinity is crossed within each NUMA domain:
 # mlx5_ib0->GPU1, mlx5_ib1->GPU0, mlx5_ib2->GPU3, mlx5_ib3->GPU2.
 # Same-HCA DataDirect loopback validates each 800-Gb/s GPU-to-HCA path at an
 # 80% floor.
 * || check_ib_bw_gdr_data_direct 640 mlx5_ib0:1 mlx5_ib1:0 mlx5_ib2:3 mlx5_ib3:2
 # 80% of the 100 GB/s NCCL-IB path rate.
 * || check_nccl_allreduce_ib_loopback 80.0 3 16G "" PHB
 * || check_ib_link_flapping
